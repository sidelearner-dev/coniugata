[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coniugata"
version = "0.1.0"
description = "A modular OSINT aggregation engine (domain recon + breach lookups)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx[http2]>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "dnspython>=2.6",
]

[project.optional-dependencies]
cache = ["hishel[async]>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
coniugata = "coniugata.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["coniugata"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
